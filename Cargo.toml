[workspace]
resolver = "2"
members = [
    "crates/srum-core",
    "crates/srum-parser",
    "crates/srum-schema",
    "crates/srum-analysis",
    "crates/srum-cli",
    "crates/srum-gui/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["Albert Hui <albert@securityronin.com>"]

[workspace.dependencies]
# Binary parsing
binrw = "0.14"

# Memory-mapped I/O
memmap2 = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# Time
jiff = { version = "0.2", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
# Output sanitization: the fleet-wide formula-injection policy (csv owns quoting).
jsonguard = "0.2"

# Hashing
sha2 = "0.10"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
tempfile = "3"

# ESE engine — published fleet crates (single source of truth: SecurityRonin/ese-forensic)
ese-core          = "0.2"
ese-integrity     = "0.3"
# Dev-only fixture builders; unpublishable (publish = false), sourced via git rev-pin.
ese-test-fixtures = { git = "https://github.com/SecurityRonin/ese-forensic.git", rev = "856758d" }
forensicnomicon   = "1"
srum-core         = { path = "crates/srum-core", version = "0.2.0" }
srum-parser       = { path = "crates/srum-parser", version = "0.3.0" }
srum-schema       = { path = "crates/srum-schema" }
srum-analysis     = { path = "crates/srum-analysis", version = "0.4.0" }

# GUI
tauri               = { version = "2" }
tauri-build         = { version = "2" }
tauri-plugin-dialog = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
unwrap_used = "deny"
expect_used = "deny"
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
implicit_hasher = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
