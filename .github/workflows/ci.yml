name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@85c7263e5e1a25a090f602419ac27f87aeb1d1e3
    with:
      # The old ci.yml ran clippy, build and test on DEFAULT features only —
      # `--all-features` appears nowhere in it.
      all-features: false
      # The srum-gui member is a Tauri app; without these the Linux leg of the
      # test matrix fails in the LINKER, which looks nothing like a missing
      # input. Copied verbatim from the old "Install Tauri Linux system
      # dependencies (srum-gui)" step, which was likewise Linux-only — macOS and
      # Windows built the GUI with no extra packages and still do.
      system-packages: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # The old ci.yml had NO coverage job, and one cannot be measured here yet:
      # `cargo llvm-cov --workspace` fails 78 of srum-cli's 89 integration tests
      # because they locate the `sr` binary by a fixed relative path that does
      # not exist under llvm-cov's relocated target dir (target/llvm-cov-target).
      # Inheriting `strict` — or inventing a floor from a run that never
      # completed — would be a fabricated gate. Off until those tests resolve the
      # binary through CARGO_BIN_EXE_sr; then measure and set a floor.
      coverage-gate: "off"
