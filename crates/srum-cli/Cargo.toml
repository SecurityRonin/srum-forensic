[package]
name = "srum-cli"
version = "0.3.2"
description = "srum4n6 — SRUM forensic analysis CLI"
edition.workspace = true
# A binary, so its floor IS the pinned toolchain (rust-toolchain.toml):
# nothing pins a library dependency against it, so there is no low-MSRV
# promise to keep. The workspace 1.80 it used to inherit was a claim its
# own dependency graph could not satisfy.
rust-version = "1.96.0"
license.workspace = true

[[bin]]
name = "srum4n6"
path = "src/main.rs"

[dependencies]
srum-analysis.workspace = true
srum-parser.workspace = true
ese-core.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde = { workspace = true }
csv.workspace = true
jsonguard.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true
ese-test-fixtures.workspace = true

[lints]
workspace = true
